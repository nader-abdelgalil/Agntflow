services:
  postgres:
    image: postgres:18-alpine
    container_name: pm-postgres
    restart: unless-stopped
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      MCP_DB_PASSWORD: ${MCP_DB_PASSWORD}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
    ports:
      - "${POSTGRES_HOST}:${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./db/init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    networks:
      - backend-net
    security_opt:
      - no-new-privileges:true

  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: pm-mcp-server
    restart: unless-stopped
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    environment:
      DB_HOST: postgres
      DB_PORT: ${POSTGRES_PORT}
      DB_USER: ${MCP_SERVER_DB_USER}
      DB_PASSWORD: ${MCP_DB_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      PORT: ${MCP_SERVER_PORT}
      MCP_API_KEY: ${MCP_API_KEY} 
    ports:
      - "${MCP_SERVER_HOST}:${MCP_SERVER_PORT}:${MCP_SERVER_PORT}"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:${MCP_SERVER_PORT}/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
      - backend-net
      - n8n-net
    security_opt:
      - no-new-privileges:true

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.40.0
    container_name: pm-n8n
    restart: unless-stopped
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    ports:
      - "${N8N_HOST}:${N8N_PORT}:${N8N_PORT}"
    environment:
      - N8N_PORT=${N8N_PORT}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL}
      # PostgreSQL Database configuration
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=${POSTGRES_PORT}
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${N8N_DB_USER}
      - DB_POSTGRESDB_PASSWORD=${N8N_DB_PASSWORD}
    volumes:
      - n8n-data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:${N8N_PORT}/healthz/readiness || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    networks:
      - n8n-net
      - backend-net
    security_opt:
      - no-new-privileges:true

